version: 3
timezone: Asia/Shanghai

repositories:
  - key: vllm
    name: vLLM
    github: vllm-project/vllm
    path: ./repositories/vllm
    remote: upstream
    defaultBranch: main
    worktreeSlots: 10

  - key: vllm-ascend
    name: vLLM Ascend
    github: vllm-project/vllm-ascend
    path: ./repositories/vllm-ascend
    remote: upstream
    defaultBranch: main
    worktreeSlots: 10

personalData:
  path: ./personal-data

knowledge:
  path: ./personal-data/knowledge
  inbox: inbox
  historyLimit: 10
  checkpoint:
    autoCommit: false
    autoPush: false
    remote: origin
    sourceRef: main
    remoteBranch: loongboard-personal-data-backup
    checkpointCron: "0 0 * * *"
    pushCron: "0 0 * * *"

runtime:
  statePath: ./.loong
  repositoriesPath: ./repositories
  worktreesPath: ./.worktrees
  serverHost: 127.0.0.1
  serverPort: 4174

agent:
  defaultProvider: deepseek-official
  defaultModel: deepseek-v4-flash
  defaultReasoningEffort: high
  idleProcessMinutes: 120
