version: 2
timezone: Asia/Shanghai

repositories:
  - key: vllm
    name: vLLM
    github: vllm-project/vllm
    path: ./repositories/vllm
    remote: upstream
    defaultBranch: main
    worktreeSlots: 10

  - key: vllm-ascend
    name: vLLM Ascend
    github: vllm-project/vllm-ascend
    path: ./repositories/vllm-ascend
    remote: upstream
    defaultBranch: main
    worktreeSlots: 10

knowledge:
  path: ./knowledge
  inbox: inbox
  historyLimit: 10
  checkpoint:
    autoCommit: false
    autoPush: false
    remote: origin
    sourceRef: main
    remoteBranch: loongboard-knowledge-backup
    checkpointCron: "0 0 * * *"
    pushCron: "0 0 * * *"

runtime:
  statePath: ./.loong
  repositoriesPath: ./repositories
  worktreesPath: ./.worktrees
  serverHost: 127.0.0.1
  serverPort: 4174

agent:
  defaultProvider: deepseek-official
  defaultModel: deepseek-v4-flash
  defaultReasoningEffort: high
  idleProcessMinutes: 120
