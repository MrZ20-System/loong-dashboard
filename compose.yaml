services:
  loongboard:
    build:
      context: .
    restart: unless-stopped
    ports:
      - "127.0.0.1:4174:4174"
    environment:
      LOONGBOARD_SYSTEM_CONFIG: /data/system.yaml
      LOONGBOARD_SERVER_HOST: 0.0.0.0
      LOONGBOARD_SERVER_PORT: 4174
    volumes:
      - "${LOONGBOARD_DATA_DIR:-./loongboard-data}:/data"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - >-
          fetch('http://127.0.0.1:4174/api/health/live')
          .then((response) => process.exit(response.ok ? 0 : 1))
          .catch(() => process.exit(1))
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
